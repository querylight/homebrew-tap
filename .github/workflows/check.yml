name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  casks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Tap this checkout so the commands below see querylight/tap. Homebrew
      # 6+ ignores third-party taps until they're trusted.
      - run: |
          mkdir -p "$(brew --repository)/Library/Taps/querylight"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/querylight/homebrew-tap"
          brew trust querylight/tap

      - run: brew style querylight/tap
      - run: brew audit --cask --new --online querylight/tap/querylight
      - run: brew livecheck --cask querylight/tap/querylight
      - run: brew install --cask querylight/tap/querylight
      - run: brew uninstall --zap --cask querylight/tap/querylight
